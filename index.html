<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplo Crypto Terminal</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root { --bg: #000000; --card: rgba(30, 30, 30, 0.4); --header: #161B22; --text: #C9D1D9; --accent: #30363D; --border: #444c56; --title: #58A6FF; --up: #3fb950; --down: #f85149; }
        [data-theme="black-white"] { --bg: #000000; --card: #000000; --header: #000000; --text: #ffffff; --accent: #1a1a1a; --border: #ffffff; --title: #ffffff; --up: #00ff00; --down: #ff0000; }
        [data-theme="white-black"] { --bg: #ffffff; --card: #f6f8fa; --header: #ffffff; --text: #000000; --accent: #e1e4e8; --border: #000000; --title: #000000; --up: #1a7f37; --down: #cf222e; }
        [data-theme="terminal"] { --bg: #050505; --card: rgba(0, 20, 0, 0.2); --header: #000000; --text: #00ff00; --accent: #003300; --border: #00ff00; --title: #00ff00; --up: #00ff00; --down: #ff0000; }
        [data-theme="gold"] { --bg: #1a140a; --card: rgba(45, 35, 15, 0.4); --header: #261e0f; --text: #f0d78c; --accent: #3d3016; --border: #d4af37; --title: #d4af37; --up: #ffd700; --down: #ff4500; }
        [data-theme="nando-gray"] { --bg: #1c1c1c; --card: #2d2d2d; --header: #141414; --text: #e0e0e0; --accent: #404040; --border: #505050; --title: #ffffff; --up: #4ade80; --down: #f87171; }
        [data-theme="forest"] { --bg: #06120B; --card: rgba(10, 45, 25, 0.4); --header: #0E3A21; --text: #A7DFB1; --accent: #1B4D31; --border: #2ECC71; --title: #2ECC71; --up: #2ecc71; --down: #e74c3c; }
        [data-theme="retro"] { --bg: #281800; --card: rgba(60, 30, 0, 0.3); --header: #3d2400; --text: #ffb000; --accent: #4d2d00; --border: #ffb000; --title: #ffb000; --up: #ffb000; --down: #ff0000; }
        [data-theme="midnight"] { --bg: #020617; --card: #1e293b; --header: #0f172a; --text: #f1f5f9; --accent: #334155; --border: #38bdf8; --title: #38bdf8; --up: #22c55e; --down: #ef4444; }
        * { box-sizing: border-box; transition: background-color 0.2s, border-color 0.2s, transform 0.5s ease; -webkit-user-select: none; font-family: 'SF Mono', 'Roboto Mono', monospace; -webkit-tap-highlight-color: transparent; }
        body { height: 100dvh; margin: 0; padding: 6px; overflow: hidden; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; touch-action: pan-y; overscroll-behavior-y: contain; }
        .header { height: 36px; display: flex; justify-content: space-between; align-items: center; padding: 0 12px; border: 1px solid var(--border); background-color: var(--header); border-radius: 6px; flex-shrink: 0; }
        .header h2 { font-size: 13px; margin: 0; color: var(--title); text-transform: uppercase; letter-spacing: 1px; }
        #status { font-size: 8px; display: flex; align-items: center; gap: 5px; font-weight: bold; transition: opacity 0.4s; }
        .status-refreshing { color: var(--up) !important; }
        .live-dot { width: 6px; height: 6px; background: var(--up); border-radius: 50%; display: inline-block; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }
        #portfolio-section { background-color: var(--card); border-radius: 6px; padding: 8px 12px; border: 1px solid var(--border); margin-top: 4px; flex-shrink: 0; }
        .portfolio-total { font-size: 20px; font-weight: 900; color: var(--text); letter-spacing: -0.5px; margin-top: 2px; }
        .btn-action { background-color: var(--accent); color: var(--text); border: 1px solid var(--border); padding: 4px 8px; border-radius: 4px; font-size: 9px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-icon { background: none; border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 12px; display: flex; align-items: center; }
        #portfolio-details { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
        .perf-row { display: flex; justify-content: space-between; margin-top: 12px; padding: 8px 4px; background: rgba(0,0,0,0.2); border-radius: 4px; border: 1px solid var(--accent); }
        .perf-item { font-size: 9px; font-weight: bold; display: flex; flex-direction: column; align-items: center; }
        .perf-label { opacity: 0.5; font-size: 7px; margin-bottom: 2px; text-transform: uppercase; }
        #main-wrapper { flex: 1; display: flex; flex-direction: column; margin: 4px 0; gap: 2px; overflow-y: auto; scrollbar-width: none; }
        .card { background-color: var(--card); border-radius: 6px; padding: 0 12px; border: 1px solid var(--border); display: flex; align-items: center; height: 42px; min-height: 42px; flex-shrink: 0; cursor: pointer; }
        .coin-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .label-text { font-weight: 800; font-size: 12px; letter-spacing: 0.5px; }
        .value-text { font-weight: 900; font-size: 13px; text-align: right; }
        .up { color: var(--up) !important; }
        .down { color: var(--down) !important; }
        .mid-row { height: 38px; display: flex; gap: 4px; flex-shrink: 0; margin-bottom: 4px; }
        .mid-btn { flex: 1; display: flex; align-items: center; justify-content: center; background-color: var(--card); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 14px; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(8px); }
        .modal { background: var(--bg); border: 2px solid var(--border); width: 100%; max-width: 360px; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .modal-scroll { padding: 20px; overflow-y: auto; max-height: 70vh; }
        .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .theme-btn { background: var(--card); color: var(--text) !important; border: 1px solid var(--border); padding: 8px; border-radius: 4px; font-size: 9px; cursor: pointer; text-transform: uppercase; }
        .news-btn { display: block; background: var(--accent); color: var(--text); padding: 12px; text-decoration: none; text-align: center; font-weight: bold; border-radius: 6px; margin-bottom: 8px; border: 1px solid var(--border); font-size: 10px; text-transform: uppercase; }
        .history-table { width: 100%; border-collapse: collapse; font-size: 10px; margin-top: 10px; }
        .history-table td { padding: 8px; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body data-theme="nando-gray">
    <div class="header">
        <div id="status"><span class="live-dot"></span> LIVE • --:--:--</div>
        <h2 id="ui-title">🚀 APLO CRYPTO TERMINAL</h2>
        <div style="display:flex; gap:12px; align-items:center;">
            <span style="cursor:pointer; font-size:18px; font-weight:bold;" onclick="openManageAssets()">+</span>
            <span style="cursor:pointer; font-size:14px;" onclick="document.getElementById('settings-overlay').style.display='flex'">⚙️</span>
        </div>
    </div>
    <div id="portfolio-section">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div><div style="font-size:8px; opacity:0.6; font-weight:bold;">NET WORTH</div><div id="portfolio-total" class="portfolio-total">$0.00</div></div>
            <div style="display:flex; gap:6px;">
                <button onclick="openDistribution()" class="btn-icon">📊</button>
                <button onclick="togglePortfolio()" class="btn-action">ASSETS</button>
                <button onclick="openEdit()" class="btn-action">EDIT</button>
            </div>
        </div>
        <div id="portfolio-details">
            <div id="portfolio-list" style="margin-bottom: 10px;"></div>
            <div class="perf-row">
                <div class="perf-item"><span class="perf-label">24h</span><span id="perf-24h">--</span></div>
                <div class="perf-item"><span class="perf-label">72h</span><span id="perf-72h">--</span></div>
                <div class="perf-item"><span class="perf-label">1w</span><span id="perf-1w">--</span></div>
            </div>
        </div>
    </div>
    <div id="main-wrapper"></div>
    <div class="mid-row">
        <div class="mid-btn" onclick="openGeneralNews()">📰</div>
        <div class="mid-btn" onclick="openGasTracker()">⛽</div>
    </div>
    <div id="settings-overlay" class="modal-overlay" onclick="this.style.display='none'"><div class="modal" onclick="event.stopPropagation()"><div class="modal-scroll"><div style="font-size:10px; font-weight:bold; color:var(--title);">THEME</div><div id="theme-grid" class="theme-grid"></div></div></div></div>
    <div id="manage-overlay" class="modal-overlay" onclick="this.style.display='none'"><div class="modal" onclick="event.stopPropagation()"><div style="padding:15px; font-weight:bold; border-bottom:1px solid var(--border); text-align:center;">MANAGE ASSETS</div><div id="asset-list-manage" style="padding:5px;"></div><div style="padding:15px;"><input type="text" id="new-asset-input" style="width:100%; padding:8px; background:#000; border:1px solid var(--border); color:#fff;"><button onclick="addNewAsset()" style="width:100%; margin-top:8px; padding:10px; background:var(--title); border:none;">ADD</button></div></div></div>
    <div id="info-overlay" class="modal-overlay" onclick="this.style.display='none'"><div class="modal" onclick="event.stopPropagation()"><div id="info-header" style="padding:15px; font-weight:bold; text-align:center;"></div><div id="info-content" style="padding: 20px;"></div></div></div>
    <div id="dist-overlay" class="modal-overlay" onclick="this.style.display='none'"><div class="modal" onclick="event.stopPropagation()"><div id="ui-dist-title" style="padding:15px; font-weight:bold; text-align:center;">DISTRIBUTION</div><div id="dist-content" style="padding: 20px;"></div></div></div>
    <script>
        let symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT"], caNames = {}, currentPrices = {}, marketData = [], touchStartY = 0;
        document.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
        document.addEventListener('touchend', (e) => {
            if (e.changedTouches[0].clientY - touchStartY > 100 && window.scrollY === 0) {
                triggerRefreshAnimation();
                updateMarket();
            }
        }, { passive: true });
        function triggerRefreshAnimation() {
            const status = document.getElementById('status');
            status.style.opacity = '0.1';
            setTimeout(() => { status.style.opacity = '1'; }, 400);
        }
        function setTheme(t) { document.body.setAttribute('data-theme', t); localStorage.setItem('theme', t); }
        async function updateMarket() {
            const statusEl = document.getElementById('status');
            statusEl.classList.add('status-refreshing');
            try {
                const res = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbols=' + JSON.stringify(symbols));
                marketData = await res.json();
                renderUI();
            } catch(e) {}
            statusEl.classList.remove('status-refreshing');
        }
        function renderUI() {
            const wrapper = document.getElementById('main-wrapper');
            wrapper.innerHTML = '';
            marketData.forEach(c => {
                const p = parseFloat(c.lastPrice), ch = parseFloat(c.priceChangePercent);
                currentPrices[c.symbol] = p;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div class="coin-row"><span>${c.symbol.replace("USDT", "")}</span><span class="${ch >= 0 ? 'up' : 'down'}">$${p.toFixed(2)}</span></div>`;
                wrapper.appendChild(card);
            });
            renderPortfolio();
        }
        function renderPortfolio() {
            let total = 0;
            symbols.forEach(s => {
                const q = parseFloat(localStorage.getItem('q_'+s)) || 0;
                const p = currentPrices[s] || 0;
                if (q > 0) total += (q * p);
            });
            document.getElementById('portfolio-total').innerText = `$${total.toFixed(2)}`;
        }
        async function openGasTracker() {
            document.getElementById('info-header').innerText = `GAS TRACKER`;
            const content = document.getElementById('info-content');
            content.innerHTML = `Loading...`;
            document.getElementById('info-overlay').style.display = 'flex';
            try {
                const res = await fetch('https://api.etherscan.io/api?module=gastracker&action=gasoracle&apikey=YourApiKeyToken');
                const data = await res.json();
                content.innerHTML = `Fast: ${data.result.FastGasPrice} Gwei`;
            } catch(e) { content.innerHTML = 'API Error'; }
        }
        function togglePortfolio() { const d = document.getElementById('portfolio-details'); d.style.display = d.style.display === 'block' ? 'none' : 'block'; }
        setInterval(() => { document.getElementById('status').innerHTML = '<span class="live-dot"></span> LIVE - ' + new Date().toLocaleTimeString(); }, 1000);
        updateMarket();
    </script>
</body>
</html>
