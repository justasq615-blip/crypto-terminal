<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplo Crypto Terminal</title>
    <style>
        :root { --bg: #1c1c1c; --card: #2d2d2d; --header: #141414; --text: #e0e0e0; --accent: #404040; --border: #505050; --title: #ffffff; --up: #4ade80; --down: #f87171; }
        * { box-sizing: border-box; font-family: 'SF Mono', monospace; }
        body { height: 100dvh; margin: 0; padding: 6px; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; }
        .header { height: 36px; display: flex; justify-content: space-between; align-items: center; padding: 0 12px; background-color: var(--header); border-radius: 6px; border: 1px solid var(--border); }
        .card { background-color: var(--card); padding: 12px; border-radius: 6px; margin-top: 4px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); cursor: pointer; }
        .label-text { font-weight: 800; font-size: 13px; }
        .value-text { font-weight: 900; font-size: 13px; }
        .up { color: var(--up); } .down { color: var(--down); }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; padding: 10px; }
        .modal { background: var(--bg); border: 1px solid var(--border); width: 100%; max-width: 400px; border-radius: 8px; padding: 20px; }
        #chart-container { width: 100%; height: 250px; background: #000; border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
        .ca-box { margin-top: 15px; padding: 10px; background: var(--header); border-radius: 4px; font-size: 10px; text-align: center; border: 1px solid var(--border); }
        .btn-add { width: 100%; padding: 12px; background: var(--title); color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-size:10px;">APLO TERMINAL</div>
        <div onclick="openManageAssets()" style="cursor:pointer;">➕</div>
    </div>

    <div id="main-wrapper"></div>

    <div id="info-overlay" class="modal-overlay" onclick="this.style.display='none'">
        <div class="modal" onclick="event.stopPropagation()">
            <div id="info-header" style="font-weight:bold; margin-bottom:10px; text-align:center;"></div>
            <div id="info-content"></div>
        </div>
    </div>

    <div id="manage-overlay" class="modal-overlay" onclick="this.style.display='none'">
        <div class="modal" onclick="event.stopPropagation()">
            <div style="text-align:center; margin-bottom:10px;">HALDA VARASID</div>
            <div id="manage-list"></div>
            <input type="text" id="new-asset-input" placeholder="TICKER või CA" style="width:100%; padding:10px; background:#000; color:#fff; border:1px solid var(--border); margin-top:10px;">
            <button class="btn-add" onclick="addNewAsset()">LISA</button>
        </div>
    </div>

    <script>
        let symbols = ["BTCUSDT", "ETHUSDT"];
        let caNames = JSON.parse(localStorage.getItem('ca_names') || '{}');
        
        async function updateMarket() {
            const wrapper = document.getElementById('main-wrapper');
            wrapper.innerHTML = '';
            
            for (let s of symbols) {
                const isDex = s.includes('0x') || s.length > 10;
                let price = 0, ch = 0, name = isDex ? (caNames[s] || "DEX Asset") : s.replace("USDT", "");

                if (!isDex) {
                    const res = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${s}`);
                    const data = await res.json();
                    price = parseFloat(data.lastPrice);
                    ch = parseFloat(data.priceChangePercent);
                } else {
                    try {
                        const res = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${s}`);
                        const data = await res.json();
                        if(data.pairs) {
                            price = parseFloat(data.pairs[0].priceUsd);
                            ch = parseFloat(data.pairs[0].priceChange.h24);
                            name = data.pairs[0].baseToken.symbol;
                            caNames[s] = name;
                        }
                    } catch(e) {}
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openInfoModal(name, s, isDex);
                card.innerHTML = `<span class="label-text">${name}</span><span class="value-text ${ch >= 0 ? 'up':'down'}">$${price.toFixed(4)}</span>`;
                wrapper.appendChild(card);
            }
            localStorage.setItem('ca_names', JSON.stringify(caNames));
        }

        function openInfoModal(name, s, isDex) {
            document.getElementById('info-header').innerText = name + " ANALYSIS";
            let html = isDex ? `<div id="chart-container"><iframe src="https://dexscreener.com/search?q=${s}&embed=1" width="100%" height="100%" frameborder="0"></iframe></div>` : `<div style="text-align:center; padding:20px;">Chart for ${name}</div>`;
            
            if (isDex) {
                html += `<div class="ca-box">CONTRACT: <span style="user-select:all;">${s}</span></div>`;
            }
            document.getElementById('info-content').innerHTML = html;
            document.getElementById('info-overlay').style.display = 'flex';
        }

        function openManageAssets() {
            const list = document.getElementById('manage-list');
            list.innerHTML = symbols.map(s => `<div style="display:flex; justify-content:space-between; padding:5px;">${caNames[s] || s} <span onclick="removeAsset('${s}')" style="cursor:pointer;">🗑️</span></div>`).join('');
            document.getElementById('manage-overlay').style.display = 'flex';
        }

        async function addNewAsset() {
            const input = document.getElementById('new-asset-input').value.trim();
            if(!input) return;
            symbols.push(input);
            localStorage.setItem('user_symbols', JSON.stringify(symbols));
            updateMarket();
            document.getElementById('manage-overlay').style.display = 'none';
        }

        function removeAsset(s) {
            symbols = symbols.filter(i => i !== s);
            localStorage.setItem('user_symbols', JSON.stringify(symbols));
            openManageAssets();
            updateMarket();
        }

        updateMarket();
    </script>
</body>
</html>
